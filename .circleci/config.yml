version: 2.1

jobs:
  flask:
    docker:
      - image: cimg/python:3.14
    steps:
      - checkout
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "uv.lock" }}
            - uv-v1-
      - run:
          name: Install dependencies
          command: |
            pip install --upgrade uv
            uv sync --locked --no-default-groups --group dev
      - save_cache:
          key: uv-v1-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Build
          command: uv build
      - run:
          name: Test
          command: uv run --locked --no-default-groups --group dev tox run -e py3.14
      - run:
          name: Lint
          command: uv run --locked --no-default-groups --group pre-commit pre-commit run --show-diff-on-failure --color=always --all-files

workflows:
  ci:
    jobs:
      - flask
